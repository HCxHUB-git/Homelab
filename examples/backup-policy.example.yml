# Sanitized example derived from the observed backup policy.
# This is documentation, not an export of the live Proxmox configuration.

mode: snapshot
schedule: daily
compression: zstd
selection:
  include: active-linux-service-guests
retention:
  keep_last: 7
target:
  type: nfs
  name: backup-storage
verification:
  check_job_status: true
  check_artifact_generation_count: true
  restore_test: required
  independent_copy: required
