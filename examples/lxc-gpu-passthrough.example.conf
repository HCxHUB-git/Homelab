# Sanitized pattern derived from the media-service LXC.
# IDs, device ownership values, storage names and network details are placeholders.

arch: amd64
cores: <allocated-cores>
memory: <allocated-memory-mib>
unprivileged: <review-required>
rootfs: <local-storage>:<guest-volume>,size=<size>
mp0: <host-media-mount>,mp=/media

# Expose only the render device required for hardware transcoding.
lxc.cgroup2.devices.allow: c 226:128 rwm
lxc.mount.entry: /dev/dri/renderD128 dev/dri/renderD128 none bind,optional,create=file

# Use a reviewed, idempotent pre-start hook to restore expected ownership.
hookscript: <trusted-snippet-storage>:snippets/<gpu-prestart-hook>
